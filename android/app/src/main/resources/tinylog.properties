# Selects the plugin's DynamicLevelLoggingProvider, registered in
# META-INF/services/org.tinylog.provider.LoggingProvider. FlutterAutofillService
# casts to it on startup, so without this the autofill service crashes the app.
# The level here is only a ceiling: the plugin forces it to OFF at runtime
# unless its debug preference is enabled.
provider = dynamic level
level = trace

# System log only. The plugin's example also writes rolling log files to disk,
# which we leave out: autofill logs describe the sites and fields being filled.
writer1 = logcat
